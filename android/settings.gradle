pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    includeBuild("../node_modules/expo-modules-core/expo-module-gradle-plugin")
    includeBuild("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
}
plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
extensions.configure(expo.modules.plugin.ExpoAutolinkingSettingsExtension){ ex ->
    ex.projectRoot = new File(rootDir, "..")
    ex.useExpoModules()
}
rootProject.name = 'ServenticaApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')



